# allowlist.yaml — capability allowlist for the Hermes tool-gate (Stage 1).
#
# Deny by default. A skill may do ONLY what is granted here. Anything not
# listed is denied. Keep this file small and legible: the whole point is that
# a human can read it and know exactly what each skill can reach.
#
# Grant shape per skill:
#   tools:  the tool names the skill may call
#   paths:  glob patterns the skill may touch (** = any depth, * = one segment)
#
# require_approval lists tools that always need a human go. In Stage 1 the
# adapter treats "ask" as block-with-reason, because the approval flow is not
# wired yet. Stage 3 turns these into a real pause-and-ask.

version: 1

require_approval:
  - execute_code
  - shell
  - delete_file

skills:

  note-taker:
    tools:
      - read_file
      - write_file
    paths:
      - "$HERMES_HOME/notes/**"

  web-researcher:
    tools:
      - web_search
      - read_file
    paths:
      - "$HERMES_HOME/research/**"
