# Required-controls catalog: seed rows for control_check.py.
# Titles as published, with no paraphrase. A profile names the rows it
# requires and the policy obligation that stands for each one.
# binding: mandatory (law), advisory (guidance), advisory_as_selected (ISO
# Annex A, applies when chosen in the statement of applicability).
# Mandatory has a scope and a start date. EU AI Act Art. 14 binds high-risk
# AI systems, from 2027-12-02 for Annex III systems and from 2028-08-02 for
# Annex I systems (Art. 113 as amended). EU CRA Annex I applies to products
# with digital elements from 2027-12-11. Outside that scope a profile may
# still require these rows; the law does not.
# ISO/IEC 27001:2022 Annex A takes its control numbers and titles from
# ISO/IEC 27002:2022, so the ISO/IEC 27001 rows cite the ISO/IEC 27002 page.
version: 1
controls:
  - key: owasp-llm-2026-llm03
    framework: OWASP Top 10 for LLM Applications
    edition: "2026"
    control_id: "LLM03:2026"
    title: Excessive Agency
    binding: advisory
    grade: A
    source_url: https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
  - key: atlas-aml-m0026
    framework: MITRE ATLAS
    edition: "2026.09"
    control_id: AML.M0026
    title: Privileged AI Agent Permissions Configuration
    binding: advisory
    grade: A
    source_url: https://raw.githubusercontent.com/mitre-atlas/atlas-data/main/dist/v6/ATLAS-2026.09.yaml
  - key: atlas-aml-m0028
    framework: MITRE ATLAS
    edition: "2026.09"
    control_id: AML.M0028
    title: AI Agent Tools Permissions Configuration
    binding: advisory
    grade: A
    source_url: https://raw.githubusercontent.com/mitre-atlas/atlas-data/main/dist/v6/ATLAS-2026.09.yaml
  - key: atlas-aml-m0029
    framework: MITRE ATLAS
    edition: "2026.09"
    control_id: AML.M0029
    title: Human In-the-Loop for AI Agent Actions
    binding: advisory
    grade: A
    source_url: https://raw.githubusercontent.com/mitre-atlas/atlas-data/main/dist/v6/ATLAS-2026.09.yaml
  - key: nist-ai-rmf-map-3-5
    framework: NIST AI RMF
    edition: "1.0"
    control_id: MAP 3.5
    title: >-
      Processes for human oversight are defined, assessed, and documented in
      accordance with organizational policies from the GOVERN function.
    binding: advisory
    grade: A
    source_url: https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf
  - key: nist-ai-rmf-manage-2-4
    framework: NIST AI RMF
    edition: "1.0"
    control_id: MANAGE 2.4
    title: >-
      Mechanisms are in place and applied, and responsibilities are assigned
      and understood, to supersede, disengage, or deactivate AI systems that
      demonstrate performance or outcomes inconsistent with intended use.
    binding: advisory
    grade: A
    source_url: https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf
  - key: eu-ai-act-art-14-1-3
    framework: EU AI Act (Regulation (EU) 2024/1689)
    edition: consolidated 2026-07-27
    control_id: Art. 14(1)-(3)
    title: Human oversight
    binding: mandatory
    grade: A
    source_url: https://eur-lex.europa.eu/eli/reg/2024/1689/2026-07-27/eng#art_14
  - key: eu-ai-act-art-14-4
    framework: EU AI Act (Regulation (EU) 2024/1689)
    edition: consolidated 2026-07-27
    control_id: Art. 14(4)
    title: Human oversight
    binding: mandatory
    grade: A
    source_url: https://eur-lex.europa.eu/eli/reg/2024/1689/2026-07-27/eng#art_14
