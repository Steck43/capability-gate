# Calls keep arriving through the real Claude Code hook while the gate's policy
# store, then its log store, is unavailable.
name: S09-gate-outage
control: fail-closed fallback (Claude Code hook)
runner: outage
seed: 1309
actor: {agent_id: synth-agent-09, user_id: synth-user-03}
traffic:
  benign: 60
fault:
  outages:
    - {kind: policy_store_down, start: 15, end: 27}
    - {kind: log_store_down, start: 35, end: 45}
expect:
  calls: benign
  calls_during_outage: fault_outage_calls
  blocked_during_outage: fault_outage_calls
  executed_during_outage: 0
  allowed_outside_outage: benign - fault_outage_calls
  decided_after_recovery: benign - fault_outage_end
