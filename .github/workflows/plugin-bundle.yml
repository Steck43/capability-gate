# Versioned Hermes plugin bundle. Not a wheel. Not GitHub's source zip.
#
# Subject: capability_gate.py + plugin.yaml + allowlist.example.yaml + SHA256SUMS
# of those bytes, packed as capability-gate-plugin-0.1.0.zip, attested, uploaded
# to the GitHub Release for tag plugin-v*.
#
# Job-scoped write: contents (release), id-token, attestations. Default
# workflow permissions stay contents: read.

name: plugin-bundle

on:
  push:
    tags:
      - "plugin-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: plugin-bundle (attest)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: build zip
        run: python scripts/build_plugin_bundle.py
      - name: attest zip
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/capability-gate-plugin-0.1.0.zip
      - name: upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/capability-gate-plugin-0.1.0.zip \
            --title "capability-gate plugin bundle ${GITHUB_REF_NAME#plugin-v}" \
            --notes "Hermes plugin bundle: capability_gate.py, plugin.yaml, allowlist.example.yaml, SHA256SUMS of those bytes. Not a source zip. Verify with gh attestation verify."
