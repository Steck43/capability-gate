# The floor. This is the layer that cannot be bypassed by the committer.
#
# Pre-commit hooks are local and `--no-verify` defeats all of them, so they are
# convenience, not control. This runs on GitHub's machines on every push and
# every pull request, including PRs from forks. Make these checks Required in
# branch protection and the floor is real.
#
# Same argument as the capability gate: the decision must not be made by the
# thing being guarded.
#
# Action pins are commit SHAs (Hermes / estate supply-chain policy). Bump by
# resolving a release tag to its peeled commit, then editing both the SHA and
# the trailing version comment.

name: floor

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  authorship:
    name: authorship (no AI trailers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: check commit messages in history
        run: |
          if git log --all --format=%B | grep -inE \
            'co-authored-by:.*(claude|cursor|copilot|gpt|gemini|assistant)|generated with .*(claude|cursor|copilot)'; then
            echo "::error::AI authorship trailer found in history"
            exit 1
          fi
          echo "no AI authorship trailers in history"

  tests:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install pytest
      - name: pytest
        # Do NOT add a step that installs the host agent to make skipped tests
        # run. On capability-gate that turns a green 37-passed/2-skipped suite
        # red in two different ways depending on which of two same-named modules
        # lands on the path. The skips are correct behaviour.
        run: pytest -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  craft-voice:
    name: craft (voice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: voice lint (commits + prose)
        run: |
          if [ -f .floor/craft/voice_lint.py ]; then V=.floor/craft/voice_lint.py
          elif [ -f craft/voice_lint.py ]; then V=craft/voice_lint.py
          else
            echo "::error::voice_lint.py missing from roof (install_floor craft pack)"
            exit 1
          fi
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          python "$V" --commits --base "$BASE" --head HEAD --prose --fail-on-warn

  craft-changelog:
    name: craft (changelog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: changelog gate
        run: |
          if [ -f .floor/craft/changelog_gate.py ]; then C=.floor/craft/changelog_gate.py
          elif [ -f craft/changelog_gate.py ]; then C=craft/changelog_gate.py
          else
            echo "::error::changelog_gate.py missing from roof"
            exit 1
          fi
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          python "$C" --base "$BASE" --head HEAD

  craft-comments:
    name: craft (comments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: comment craft
        run: |
          if [ -f .floor/craft/comment_craft.py ]; then C=.floor/craft/comment_craft.py
          elif [ -f craft/comment_craft.py ]; then C=craft/comment_craft.py
          else
            echo "::error::comment_craft.py missing from roof"
            exit 1
          fi
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          python "$C" --base "$BASE" --head HEAD

  craft-empty-diff:
    name: craft (empty-diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: empty-diff gate
        run: |
          if [ -f .floor/craft/empty_diff_gate.py ]; then C=.floor/craft/empty_diff_gate.py
          elif [ -f craft/empty_diff_gate.py ]; then C=craft/empty_diff_gate.py
          else
            echo "::error::empty_diff_gate.py missing from roof"
            exit 1
          fi
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          python "$C" --base "$BASE" --head HEAD
