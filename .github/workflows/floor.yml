# The floor. This is the layer that cannot be bypassed by the committer.
#
# Pre-commit hooks are local and `--no-verify` defeats all of them, so they are
# convenience, not control. This runs on GitHub's machines on every push and
# every pull request, including PRs from forks. Make these checks Required in
# branch protection and the floor is real.
#
# Same argument as the capability gate: the decision must not be made by the
# thing being guarded.
#
# Action pins are commit SHAs (Hermes / estate supply-chain policy). Bump by
# resolving a release tag to its peeled commit, then editing both the SHA and
# the trailing version comment.
#
# Craft BASE: on pull_request the PR base SHA; on push github.event.before;
# on a schedule or manual run this commit. Never the root commit. Every step
# runs under bash -eo pipefail and holds only plain commands and pipes, so a
# failing command always fails the step (no conditions, &&, ||, background
# jobs, command substitution, functions, loops or groups). Every command has
# one exact shape per job, and python always runs with -I so no file in the
# checkout is importable. scripts/floor_guard.py enforces all of this.

name: floor

on:
  push:
    branches: [main]
  # edited reruns the floor when a title or body changes after the last push,
  # so the title and body leak scan always reads the current text.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  secrets:
    name: secrets (gitleaks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  leak-denylist:
    name: secrets (names and personal paths)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The scanner runs from the default branch, not from the change it judges,
      # so a pull request cannot weaken the check that reads it. main without a
      # scanner fails this step at git cat-file: there is no fallback.
      - name: load scanner from main
        run: |
          git cat-file -e origin/main:scripts/leak_denylist_scan.py
          git show origin/main:scripts/leak_denylist_scan.py > "$RUNNER_TEMP/leak_scan.py"
      # The list of names is a repo secret, never a tracked file: a public list
      # of private names is the leak. An unset secret fails closed, which also
      # means fork PRs (no secret access) fail here until a maintainer reruns.
      # The range starts at the previous main on push and at main on a pull
      # request; a base that does not resolve fails the step.
      - name: scan each commit and its message
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          SCAN_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: |
          git rev-parse --verify "$SCAN_BASE^{commit}"
          python -I "$RUNNER_TEMP/leak_scan.py" --ci --base "$SCAN_BASE" --head HEAD
      - name: scan pull request title and body
        if: github.event_name == 'pull_request'
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | python -I "$RUNNER_TEMP/leak_scan.py" --text "pull request title and body"

  kat-lint:
    name: tests (known-answer tests call the gate)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -I scripts/kat_lint.py

  authorship:
    name: authorship (no AI trailers)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Plain commands only: a failing git log or a trailer found fails the step.
      - name: check commit messages in history
        run: |
          git log --all --format=%B > "$RUNNER_TEMP/history.txt"
          python -I scripts/no_ai_trailers.py "$RUNNER_TEMP/history.txt"

  tests:
    name: tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    # The boundary test needs aegis-atoms and isolation-layer beside this roof.
    # Each repo gets its own directory and pytest runs from capability-gate, so
    # pytest never collects the siblings' tests. Pins are full SHAs, moved by
    # hand and never backward to make a test pass. The isolation pin sits on
    # spine1/live-box: isolation-layer main stores one receipt with line endings
    # its own attributes rewrite, so a checkout of main is never clean.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: capability-gate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Steck43/aegis-atoms
          ref: 4a724a23ed90185e626bf85052738021e9585407 # master, merge of #76
          path: aegis-atoms
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Steck43/isolation-layer
          ref: a27c8ee424d96a18a9147bab5689a78e819b7184 # spine1/live-box, merge of #24
          path: isolation-layer
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        working-directory: capability-gate
        run: python -I -m pip install --require-hashes --no-deps -r requirements-ci.lock
      - name: pytest
        # Do NOT add a step that installs the host agent to make skipped tests
        # run. On capability-gate that turns a green suite red in two different
        # ways depending on which of two same-named modules lands on the path.
        # The skips are correct behaviour.
        # -n 4 runs four pytest-xdist workers, one per runner core. The main
        # process writes the run record from what the workers hand back
        # (see conftest.py).
        working-directory: capability-gate
        env:
          AEGIS_ATOMS_ROOT: ${{ github.workspace }}/aegis-atoms
          ISOLATION_LAYER_ROOT: ${{ github.workspace }}/isolation-layer
          FLOOR_RUN_RECORD: ${{ runner.temp }}/pytest-run.json
        run: pytest -q -n 4
      # pytest exits 0 when a test module ends the process early (os._exit),
      # so the job also needs the run record that only a finished session
      # writes, covering every test module (see conftest.py).
      - name: every test module ran
        working-directory: capability-gate
        env:
          FLOOR_RUN_RECORD: ${{ runner.temp }}/pytest-run.json
        run: python -I scripts/run_record_check.py "$FLOOR_RUN_RECORD"

  # Advisory, not a required check. Every known-answer test must change its
  # answer when the gate does: each KAT file runs under the real gate,
  # allow-all, deny-all, an inverted gate and one mutant per constant verdict
  # in the decision, installed in the gate module of a scratch copy. A branch
  # no KAT reaches is listed, not failed. See scripts/kat_swap.py.
  kat-swap:
    name: tests (KAT answers follow the gate, advisory)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -I -m pip install --require-hashes --no-deps -r requirements-ci.lock
      - run: python -I scripts/kat_swap.py

  lint:
    name: lint (ruff)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pin matches atoms. Unpinned install pulled 0.16 on 2026-09-12 and reddened I001/RUF100.
      - run: python -I -m pip install --require-hashes --no-deps -r requirements-ci.lock
      - run: ruff check .
      - run: ruff format --check .

  craft-voice:
    name: craft (voice)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # BASE is the pull request base, the previous main on push, or this
      # commit on a schedule or manual run (an empty range the craft scripts
      # treat as nothing in scope). A base that does not resolve fails the step.
      - name: voice lint (commits + prose)
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRAFT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CRAFT_HEAD: ${{ github.sha }}
        run: |
          git rev-parse --verify "$CRAFT_BASE^{commit}"
          python -I .floor/craft/empty_range.py --base "$CRAFT_BASE" --head "$CRAFT_HEAD" --event "$EVENT_NAME"
          python -I .floor/craft/voice_lint.py --commits --base "$CRAFT_BASE" --head HEAD --prose --fail-on-warn

  craft-changelog:
    name: craft (changelog)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: changelog gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRAFT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CRAFT_HEAD: ${{ github.sha }}
        run: |
          git rev-parse --verify "$CRAFT_BASE^{commit}"
          python -I .floor/craft/empty_range.py --base "$CRAFT_BASE" --head "$CRAFT_HEAD" --event "$EVENT_NAME"
          python -I .floor/craft/changelog_gate.py --base "$CRAFT_BASE" --head HEAD

  craft-comments:
    name: craft (comments)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: comment craft
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRAFT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CRAFT_HEAD: ${{ github.sha }}
        run: |
          git rev-parse --verify "$CRAFT_BASE^{commit}"
          python -I .floor/craft/empty_range.py --base "$CRAFT_BASE" --head "$CRAFT_HEAD" --event "$EVENT_NAME"
          python -I .floor/craft/comment_craft.py --base "$CRAFT_BASE" --head HEAD

  craft-empty-diff:
    name: craft (empty-diff)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: empty-diff gate
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse --verify "$PR_BASE^{commit}"
          python -I .floor/craft/empty_diff_gate.py --base "$PR_BASE" --head HEAD

  floor-guard:
    name: floor (guard from base)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The guard, its pins and its lock come from the base: the pull request
      # base, the previous main on push, or this commit on a schedule or manual
      # run of main. A base without them fails git cat-file; there is no
      # fallback to the copy under review.
      - name: load the guard from the base branch
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          git rev-parse --verify "$GUARD_BASE^{commit}"
          mkdir -p "$RUNNER_TEMP/floor"
          git cat-file -e "$GUARD_BASE:scripts/floor_guard.py"
          git cat-file -e "$GUARD_BASE:.github/floor-pins.json"
          git cat-file -e "$GUARD_BASE:requirements-ci.lock"
          git show "$GUARD_BASE:scripts/floor_guard.py" > "$RUNNER_TEMP/floor/floor_guard.py"
          git show "$GUARD_BASE:.github/floor-pins.json" > "$RUNNER_TEMP/floor/floor-pins.json"
          git show "$GUARD_BASE:requirements-ci.lock" > "$RUNNER_TEMP/floor/requirements-ci.lock"
          echo "guard from base $GUARD_BASE"
      - name: install the base lock
        run: python -I -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/floor/requirements-ci.lock"
      - name: run the base guard on this tree
        run: python -I "$RUNNER_TEMP/floor/floor_guard.py" --root . --pins "$RUNNER_TEMP/floor/floor-pins.json"

  workflow-lint:
    name: workflow (zizmor + actionlint)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/actionlint.tgz actionlint
          /tmp/actionlint -color
